name: Build and Release RoyalRepairShop EXE

on:
  workflow_dispatch:
    inputs:
      version:
        description: "شماره نسخه انتشار، مانند 5.0.2"
        required: true
        default: "5.0.4"
  push:
    branches:
      - main
    paths:
      - "RoyalRepairShop_GoodsOut_Mashhad.py"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: write

jobs:
  build:
    name: Build Windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            python_arch: x86
          - arch: x64
            python_arch: x64
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.python_arch }}

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm --onefile --windowed --name RoyalRepairShop RoyalRepairShop_GoodsOut_Mashhad.py
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Move-Item -Force dist/RoyalRepairShop.exe "dist/RoyalRepairShop-${{ matrix.arch }}.exe"

      - name: Upload architecture build
        uses: actions/upload-artifact@v4
        with:
          name: RoyalRepairShop-Windows-${{ matrix.arch }}
          path: dist/RoyalRepairShop-${{ matrix.arch }}.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release and update manifest
    needs: build
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ inputs.version || '5.0.4' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download both architectures
        uses: actions/download-artifact@v4
        with:
          pattern: RoyalRepairShop-Windows-*
          path: dist
          merge-multiple: true

      - name: Generate SHA256 and version manifest
        shell: pwsh
        run: |
          $x86 = Get-Item "dist/RoyalRepairShop-x86.exe"
          $x64 = Get-Item "dist/RoyalRepairShop-x64.exe"
          $manifest = @{
            update_version = $env:RELEASE_VERSION
            display_version = $env:RELEASE_VERSION
            architectures = @{
              x86 = @{
                file = $x86.Name
                sha256 = (Get-FileHash $x86.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
                url = "https://github.com/${{ github.repository }}/releases/download/v$($env:RELEASE_VERSION)/$($x86.Name)"
              }
              x64 = @{
                file = $x64.Name
                sha256 = (Get-FileHash $x64.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
                url = "https://github.com/${{ github.repository }}/releases/download/v$($env:RELEASE_VERSION)/$($x64.Name)"
              }
            }
            changelog = @(
              "به‌روزرسانی خودکار اصلاح شد و فایل مناسب معماری ویندوز انتخاب می‌شود.",
              "نسخه‌های ۳۲ و ۶۴ بیتی به‌صورت جداگانه منتشر می‌شوند.",
              "پیش از جایگزینی برنامه، از پایگاه داده با تاریخ شمسی پشتیبان تهیه می‌شود."
            )
          }
          $manifest | ConvertTo-Json -Depth 8 | Set-Content -Path version.json -Encoding utf8
          Get-Content version.json

      - name: Commit version manifest
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "Publish updater manifest v$env:RELEASE_VERSION"
          git pull --rebase origin main
          git push

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: RoyalRepairShop v${{ env.RELEASE_VERSION }}
          target_commitish: main
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/RoyalRepairShop-x86.exe
            dist/RoyalRepairShop-x64.exe
