name: Build and Release RoyalRepairShop v5

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # A 32-bit EXE runs on both 32-bit and 64-bit Windows.
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up 32-bit Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x86"

      - name: Verify Python architecture
        shell: pwsh
        run: |
          python -c "import struct,sys; print(sys.version); print(f'{struct.calcsize(chr(80))*8}-bit Python'); assert struct.calcsize('P')*8 == 32"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller>=6,<7"

      - name: Build EXE
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name RoyalRepairShop RoyalRepairShop_DeviceReplacement_FIXED_UPDATER.py

      - name: Generate update manifest
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist/RoyalRepairShop.exe" -Algorithm SHA256).Hash.ToLower()
          @"
          {
            "version": "5.0.0",
            "update_version": "5.0.0",
            "display_version": "5.0.0",
            "file": "RoyalRepairShop.exe",
            "sha256": "$hash",
            "url": "https://github.com/asheghankoohestan-byte/RoyalRepairv4/releases/download/v5.0.0/RoyalRepairShop.exe",
            "changelog": [
              "انتشار نسخه ۵ برنامه RoyalRepairShop",
              "به‌روزرسانی سیستم دریافت نسخه‌های جدید",
              "ساخت فایل اجرایی ۳۲ بیتی سازگار با ویندوزهای ۳۲ و ۶۴ بیتی"
            ]
          }
          "@ | Set-Content -Path version.json -Encoding utf8

      - name: Commit update manifest
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "Publish version 5.0.0 update manifest"
          git push origin HEAD:main

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.0.0
          name: RoyalRepairShop v5.0.0
          body: |
            نسخه ۵ برنامه RoyalRepairShop

            فایل اجرایی ۳۲ بیتی برای اجرا روی ویندوزهای ۳۲ و ۶۴ بیتی.
            فایل به‌روزرسانی همراه با SHA256 در version.json ثبت شده است.
          files: dist/RoyalRepairShop.exe
          draft: false
          prerelease: false
